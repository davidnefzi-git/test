id: calvo-prices-domestic
kind: friction
friction: Staggered setting of domestic goods prices with a constant reset probability
summary: >
  Calvo pricing applied to domestically produced goods. The same mechanism as
  calvo-prices, on a different price index: the Phillips curve is in domestic inflation,
  not CPI inflation, which in an open economy are distinct variables.

citation:
  authors: [Calvo]
  year: 1983
  title: "Staggered Prices in a Utility-Maximizing Framework"
  journal: "Journal of Monetary Economics 12(3), 383-398"
  doi: 10.1016/0304-3932(83)90060-0
  url: null

variables:
  provides: []
  requires: [pi_h, x]

parameters:
  - name: theta_p
    symbol: "θ"
    description: Probability that a domestic price is NOT reset in a given quarter
    default: 0.75
    units: null
    frequency: quarterly
    range: [0.0, 0.95]
    method: estimated
    source: "Gali and Monacelli (2005), baseline calibration: an average price duration of one year"
    prior:
      family: beta
      hyperparameters: [0.5, 0.1]
      bounds: [0.0, 0.95]
      fixed: false
      note: "hyperparameters are mean and standard deviation"
  - name: lambda_gm
    description: Calvo reset term in the slope of the open-economy Phillips curve
    default: null
    units: null
    frequency: none
    method: derived
    source: "Gali and Monacelli (2005), defined below eq. (32)"
    formula: "(1 - beta*theta_p)*(1 - theta_p)/theta_p"
  - name: kappa_a
    symbol: "κ_a"
    description: >
      Slope of the open-economy Phillips curve. Note that it depends on sigma_a rather
      than sigma, so openness enters the slope of the Phillips curve and not only the
      IS curve.
    default: null
    units: null
    frequency: none
    method: derived
    source: "Gali and Monacelli (2005), defined below eq. (36)"
    formula: "lambda_gm*(sigma_a + varphi)"

equations:
  - id: nkpc-domestic
    status: original
    source_check: verified_primary
    derivation: "docs/theory/open-economy.md#domestic-phillips-curve"
    expr: "pi_h - beta*pi_h(+1) - kappa_a*x"
    description: Phillips curve in domestic inflation
    source: "Gali and Monacelli (2005), eq. (36)"

replaces: [core-soe-gm.flex-price-output]
