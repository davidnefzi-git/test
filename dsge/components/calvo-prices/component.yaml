id: calvo-prices
kind: friction
friction: Staggered price setting with a constant reset probability
summary: >
  Calvo pricing. Introduces no new variable: it replaces the core's flexible-price
  condition by the New Keynesian Phillips curve, determining the same variables through
  a different mechanism. The worked example of the provides / requires / replaces
  pattern.

citation:
  authors: [Gali]
  year: 2015
  title: "Monetary Policy, Inflation, and the Business Cycle, 2nd ed., chapters 3 and 6"
  journal: "Princeton University Press"
  doi: null
  url: null

variables:
  provides: []
  # `mc` and `pi`, not `x` and `pi`. The equation below was once written in the output
  # gap, and the declaration was never updated when it was rewritten in marginal cost:
  # `mc` was used and undeclared, `x` was declared and unused. Both halves of that
  # mistake matter. An undeclared requirement defeats the composition check, which
  # verifies that everything a component requires is provided -- so this block could be
  # mounted on a core providing no marginal cost, and the error would surface only at
  # matrix assembly, as an unresolved symbol. A stale requirement is the other way
  # round: it asserts a dependency the equations do not have.
  requires: [pi, mc]

parameters:
  - name: theta_p
    symbol: "θ"
    description: Probability that a price is NOT reset in a given quarter
    default: 0.75
    units: null
    frequency: quarterly
    range: [0.0, 0.95]
    method: estimated
    source: "Gali (2015) ch. 3 uses 0.75, an average price duration of one year; prior from the Smets-Wouters (2007) convention for Calvo probabilities"
    prior:
      family: beta
      hyperparameters: [0.5, 0.1]
      bounds: [0.0, 0.95]
      fixed: false
      note: "hyperparameters are mean and standard deviation"
  - name: epsilon_p
    symbol: "ε"
    description: Elasticity of substitution across goods
    default: 9.0
    units: null
    frequency: none
    range: [2.0, 20.0]
    method: calibrated
    source: "Gali (2015) ch. 3, implying a steady-state gross markup of 1.125"
  - name: Theta
    description: Decreasing-returns correction entering the slope of the Phillips curve
    default: null
    units: null
    frequency: none
    method: derived
    source: "Gali (2015) ch. 3, definition of Theta"
    formula: "(1 - alpha) / (1 - alpha + alpha*epsilon_p)"
  - name: lambda_p
    description: Calvo reset term entering the slope of the Phillips curve
    default: null
    units: null
    frequency: none
    method: derived
    source: "Gali (2015) ch. 3, definition of lambda"
    formula: "((1 - theta_p)*(1 - beta*theta_p)/theta_p) * Theta"
  - name: kappa
    symbol: "κ"
    description: >
      Slope of the Phillips curve in the output gap, under flexible wages. No longer
      used by the equation below, which is written in marginal cost, but retained
      because the nesting rate and the entry's closed-form targets are stated in terms
      of it, and because it is the quantity a reader of the textbook expects to find.
    default: null
    units: null
    frequency: none
    method: derived
    source: "Gali (2015) ch. 3, definition of kappa"
    formula: "lambda_p * (sigma + (varphi + alpha)/(1 - alpha))"

equations:
  - id: nkpc
    status: original
    source_check: verified_primary
    derivation: "docs/theory/price-setting.md#calvo-phillips-curve"
    expr: "pi - beta*pi(+1) - lambda_p*mc"
    description: >
      New Keynesian Phillips curve, in real marginal cost. Composed with the core's
      flexible-wage marginal-cost equation this is the familiar form with slope
      kappa = lambda_p*(sigma + (varphi + alpha)/(1 - alpha)); composed with
      calvo-wages instead, the same equation delivers the two-friction model without
      being touched.
    source: "Galí (2015), ch. 3, eqs. (17), (21)-(22), and ch. 6, eq. (18); primary source checked. The component uses the marginal-cost form."

replaces: [core-nk-classical.flex-price-output]
depends_on: [core-nk-classical]
incompatible_with: [rotemberg-prices]
compatible_cores: [core-nk-classical]
minimum_perturbation_order: 1
solution_requirement: "First order for dynamics. Second order is required for any welfare statement, and is not available while the equations are supplied log-linearised."

nesting_target:
  parameter: theta_p
  limit: 0
  recovers: [core-nk-classical, taylor-rule]
  statement: >
    As theta_p goes to zero every price is reset each quarter, the Phillips curve
    becomes vertical, and the output gap returns to zero at every date. The composed
    model must then reproduce the classical model's response to a monetary shock: real
    neutrality, with inflation still determined by the policy rule. The convergence is
    linear in theta_p, and the constant is implied analytically, which is what the rate
    field below checks.
  tolerance: 1.0e-4
  rate: "-(1 - beta*rho_v)/(Theta*(sigma + (varphi + alpha)/(1 - alpha))*(phi_pi - rho_v))"
  pathological: false
  probe:
    shock: eps_v
    variable: x
    period: 0
    sequence: [0.1, 0.01, 1.0e-3, 1.0e-4]

assumptions:
  - id: dixit-stiglitz-demand
    status: canonical
    embodied_in: [nkpc]
    statement: >
      Varieties are aggregated with a constant elasticity of substitution, so a firm's
      demand elasticity does not depend on its relative price.
    substituting: >
      Under a Kimball aggregator the elasticity rises with the relative price and the
      slope gains a curvature factor; calvo-prices-kimball is that case. Strategic
      complementarity in pricing would change the slope again.
  - id: constant-reset-hazard
    status: canonical
    embodied_in: [nkpc]
    statement: >
      A price is reset with a probability that is constant and independent of how long it
      has stood, which is what makes the price index a simple convex combination and the
      curve a two-term difference equation.
    substituting: >
      Menu costs or state-dependent pricing break the aggregation step entirely; the
      resulting curve is not this one with a different parameter.
  - id: zero-inflation-steady-state
    status: canonical
    embodied_in: [nkpc]
    statement: >
      The curve approximates around a steady state with zero inflation, so relative price
      dispersion is second order.
    substituting: >
      At trend inflation the curve acquires extra terms and the slope is no longer
      lambda_p. docs/theory/price-setting.md section 7.

verification:
  reviewed_by: null
  notes: >
    Marginal-cost representation of Galí's Phillips curve; the output-gap slope follows upon imposing flexible wages.

  open_questions:
    - >
      Indexation to past inflation exists as `price-indexation`, but it depends on
      `calvo-prices-kimball` rather than on this component: it was written for the
      medium-scale family, whose Phillips curve carries trend growth and a Kimball
      slope. An indexation block for THIS component, with Galli's parameterisation,
      does not exist. The open question is whether one is worth having or whether the
      two pricing blocks should be unified -- see docs/theory/price-setting.md, which
      derives both from the same primitives.

provenance:
  source_url: null
  repository: null
  license: "Own implementation, written from the article and textbook statements"
  redistributable: true
  permission_note: null
  ingested_by: "Claude (composition prototype)"
  ingested_on: "2026-10-15"
