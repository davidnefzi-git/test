  provides: []
  requires: [rr, i, pi]

parameters: []

equations:
  - id: fisher
    status: standard
    source_check: standard_identity
    expr: "rr - (i - pi(+1))"
    description: >
      Expected inflation, not realised: the real rate relevant to an intertemporal
      decision taken at t is the nominal rate at t less the inflation expected between t
      and t+1. Writing pi instead of pi(+1) here is a timing error that leaves the model
      solvable and shifts every impulse response.
    source: "Standard"

