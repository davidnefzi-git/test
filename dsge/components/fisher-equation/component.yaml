id: fisher-equation
kind: assumption
summary: >
  The real rate the household prices equals the nominal rate the central bank sets less
  expected inflation. One equation, no parameter, no friction -- and a component rather
  than a line in the core, for a structural reason: it is the ONLY place the nominal side
  touches the real block, so a model without it is a model with no nominal side at all.
  That is exactly the flexible-price twin, which is why removing this component has to be
  possible.

  It provides no variable. The real rate belongs to the core, which prices it; inflation
  belongs to the price-setting block, which determines it; the nominal rate belongs to
  the policy rule, which sets it. This equation only ties the three together, and the
  assembler's global equation count is what accounts for it.

citation:
  authors: [Fisher]
  year: 1896
  title: "Appreciation and Interest"
  journal: "Publications of the American Economic Association 11(4), 1-98"
  doi: null
  url: null

