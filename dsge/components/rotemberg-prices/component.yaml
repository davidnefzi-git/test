id: rotemberg-prices
kind: friction
friction: Quadratic cost of changing prices
summary: >
  Rotemberg pricing, the alternative to Calvo. Equivalent to Calvo at first order and
  not beyond, which is why the two are declared mutually incompatible rather than
  treated as aliases. Carried here for two reasons: it exercises the incompatibility
  check, and it gives the nesting machinery a second component with a different limit.

citation:
  authors: [Rotemberg]
  year: 1982
  title: "Sticky Prices in the United States"
  journal: "Journal of Political Economy 90(6), 1187-1211"
  doi: 10.1086/261117
  url: null

variables:
  provides: []
  requires: [pi, mc]

parameters:
  - name: phi_rotemberg
    description: Price adjustment cost parameter
    default: 372.79
    units: null
    frequency: none
    range: [0.0, 500.0]
    method: calibrated
    source: "Chosen so that the coefficient on marginal cost matches the Calvo calibration at theta_p = 0.75, epsilon_p = 9: phi_rotemberg = (epsilon_r - 1)/lambda_p, rounded"
  - name: epsilon_r
    description: Elasticity of substitution across goods, declared by this component rather than borrowed
    default: 9.0
    units: null
    frequency: none
    range: [2.0, 20.0]
    method: calibrated
    source: "Matches the Calvo calibration for comparability"
  - name: lambda_pr
    description: >
      Coefficient on real marginal cost in the Phillips curve under a quadratic
      adjustment cost. The analogue of lambda_p, not of kappa: the Rotemberg curve is
      stated in marginal cost, so calling this a slope in the output gap — as an
      earlier version of this file did — confuses the two and makes the comparison
      with Calvo wrong by the factor (sigma + (varphi + alpha)/(1 - alpha)).
    default: null
    units: null
    frequency: none
    method: derived
    source: "Rotemberg (1982); the first-order mapping to the Calvo coefficient is the subject of Born and Pfeifer on Calvo versus Rotemberg"
    formula: "(epsilon_r - 1) / phi_rotemberg"

equations:
  - id: nkpc-rotemberg
    status: derived
    source_check: pending
    derivation: "docs/theory/price-setting.md#rotemberg-equivalence"
    expr: "pi - beta*pi(+1) - lambda_pr*mc"
    description: Phillips curve implied by a quadratic cost of changing prices, to first order, in real marginal cost
    source: null

replaces: [core-nk-classical.flex-price-output]
depends_on: [core-nk-classical]
incompatible_with: [calvo-prices]
compatible_cores: [core-nk-classical]
minimum_perturbation_order: 1
solution_requirement: "First order reproduces Calvo. The difference between the two appears only at second order and above, so that comparison is out of reach until the non-linear equations are carried."

nesting_target:
  parameter: phi_rotemberg
  limit: 0
  recovers: [core-nk-classical, taylor-rule]
  statement: >
    A zero adjustment cost, not an infinite one, is the frictionless limit: as phi_rotemberg
    goes to zero the Phillips curve becomes vertical and the output gap returns to zero.
    Recorded explicitly because the direction of the limit differs from Calvo's and
    cannot be inferred from the fact that a component is a price friction.
  tolerance: 1.0e-4
  rate: "-(1 - beta*rho_v)/((epsilon_r - 1)*(sigma + (varphi + alpha)/(1 - alpha))*(phi_pi - rho_v))"
  pathological: false
  probe:
    shock: eps_v
    variable: x
    period: 0
    sequence: [1.0, 0.1, 0.01, 1.0e-3]

assumptions:
  - id: representative-firm-no-dispersion
    status: canonical
    embodied_in: [nkpc-rotemberg]
    statement: >
      A single firm changes its price every period at a convex cost, so there is no
      distribution of relative prices. Calvo's staggering produces one.
    substituting: >
      This is why the two are equivalent only to first order: the adjustment cost is a
      resource cost, the dispersion is an allocative distortion, and the difference is
      second order. docs/theory/price-setting.md section 6.
  - id: frictionless-limit-at-zero
    status: canonical
    embodied_in: [nkpc-rotemberg]
    statement: >
      The frictionless limit is a ZERO adjustment cost, the opposite direction to Calvo's,
      whose frictionless limit is a zero reset probability.
    substituting: >
      A reader assuming that the friction parameter goes to zero in both gets one of them
      backwards.

verification:
  reviewed_by: null
  notes: >
    First-order equivalence with calvo-prices IS tested, in tests/test_levels.py, with
    phi_rotemberg set from the Calvo slope rather than from the rounded default below;
    the two models' impulse responses then agree to machine precision. The derivation of
    the equivalence is in docs/theory/price-setting.md, section 6.

    Two earlier statements in this field have been removed because they had become
    false. One said the equivalence was untested, which it no longer is. The other was
    parked in `open_questions` with a RESOLVED prefix, which left a resolved item in the
    field reserved for unresolved ones. Both are recorded here rather than deleted
    silently, because the risk they created is specific: a reader -- or a language model
    -- taking `open_questions` as a list of what remains open would have inferred that
    this component's central property was unestablished, and taking `notes` at face
    value would have inferred the same thing twice over.
  open_questions:
    - "The non-equivalence beyond first order is the whole point of the comparison and needs the non-linear equations."

provenance:
  source_url: null
  repository: null
  license: "Own implementation, written from the article"
  redistributable: true
  permission_note: null
  ingested_by: "Claude (composition prototype)"
  ingested_on: "2026-10-15"
