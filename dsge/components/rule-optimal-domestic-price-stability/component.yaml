id: rule-optimal-domestic-price-stability
kind: policy
friction: null
summary: >
  Optimal policy in this model: complete stabilisation of domestic inflation. Under the article's assumptions this closes the output gap at every date, which gives the entry an exact closed-form target.

citation:
  authors: [Gali, Monacelli]
  year: 2005
  title: "Monetary Policy and Exchange Rate Volatility in a Small Open Economy"
  journal: "Review of Economic Studies 72(3), 707-734"
  doi: 10.1111/j.1467-937X.2005.00349.x
  url: null

variables:
  provides: []
  requires: [pi_h]

parameters: []

equations:
  - id: policy-optimal
    status: original
    source_check: verified_primary
    derivation: "docs/theory/open-economy.md#monetary-regimes"
    expr: "pi_h"
    description: Domestic inflation is held at zero at every date
    source: "Gali and Monacelli (2005), p. 724-725"

depends_on: [core-soe-gm]
incompatible_with: [rule-domestic-inflation, rule-cpi-inflation, rule-exchange-rate-peg]
compatible_cores: [core-soe-gm]
minimum_perturbation_order: 1
solution_requirement: null

assumptions:
  - id: optimal-in-this-model-only
    status: canonical
    embodied_in: [policy-optimal]
    statement: >
      Complete domestic price stability is optimal in the article's small open economy
      with complete markets and the law of one price. It is not a general result.
    substituting: >
      Under incomplete markets or incomplete pass-through it is not optimal, and the
      library cannot rank regimes by welfare in any case: that needs a second order.

verification:
  reviewed_by: null
  notes: >
    Strict domestic-price stability is optimal only under the special welfare assumptions in Galí–Monacelli (2005).

  open_questions: []

provenance:
  source_url: null
  repository: null
  license: "Own implementation, written from the article"
  redistributable: true
  permission_note: null
