id: rule-cpi-inflation
kind: policy
friction: null
summary: >
  CPI inflation-based Taylor rule (CITR): the policy rate responds to headline inflation. Differs from the domestic rule by the terms-of-trade component of the CPI, which is the whole point of the comparison.

citation:
  authors: [Gali, Monacelli]
  year: 2005
  title: "Monetary Policy and Exchange Rate Volatility in a Small Open Economy"
  journal: "Review of Economic Studies 72(3), 707-734"
  doi: 10.1111/j.1467-937X.2005.00349.x
  url: null

variables:
  provides: []
  requires: [i, pi]

parameters: 
  - name: phi_pi
    description: Response of the policy rate to inflation
    default: 1.5
    units: null
    frequency: none
    range: [1.001, 3.0]
    method: estimated
    source: "Gali and Monacelli (2005), baseline calibration"
    prior:
      family: normal
      hyperparameters: [1.5, 0.25]
      bounds: [1.001, null]
      fixed: false
      note: "the lower bound enforces determinacy"

equations:
  - id: policy-rule-citr
    status: original
    source_check: verified_primary
    derivation: "docs/theory/open-economy.md#monetary-regimes"
    expr: "i - phi_pi*pi"
    description: Interest rate rule in CPI inflation
    source: "Gali and Monacelli (2005), p. 724-725"

depends_on: [core-soe-gm]
incompatible_with: [rule-domestic-inflation, rule-exchange-rate-peg, rule-optimal-domestic-price-stability]
compatible_cores: [core-soe-gm]
minimum_perturbation_order: 1
solution_requirement: null

assumptions:
  - id: cpi-not-domestic-inflation
    status: canonical
    embodied_in: [policy-rule-citr]
    statement: >
      The rule responds to CPI inflation, which differs from domestic-goods inflation by
      the change in the terms of trade. The two rules are different rules with different
      equilibria, which is what the article's comparison is about.
    substituting: >
      rule-domestic-inflation is the alternative; the two provide the same variable and
      cannot be composed together.
  - id: price-level-not-pinned
    status: canonical
    embodied_in: [policy-rule-citr]
    statement: >
      A rule in an inflation RATE pins the rate and not the price level, so the solution
      carries a unit root: the price level wanders, and with it the nominal exchange rate
      and the level of the terms of trade.
    substituting: >
      rule-exchange-rate-peg pins the price level and removes the root. Anything computing
      unconditional moments must detrend first.

verification:
  reviewed_by: null
  notes: >
    CPI-inflation rule, distinct from the domestic-inflation reaction function in Galí–Monacelli.

  open_questions: []

provenance:
  source_url: null
  repository: null
  license: "Own implementation, written from the article"
  redistributable: true
  permission_note: null
