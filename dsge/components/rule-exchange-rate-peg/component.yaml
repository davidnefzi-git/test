id: rule-exchange-rate-peg
kind: policy
friction: null
summary: >
  An exchange rate peg: the nominal exchange rate is held fixed and the policy rate is whatever that requires. Carried because it is one of the four regimes the article compares, and because it is the clearest case of a policy block that fixes a variable other than the interest rate.

citation:
  authors: [Gali, Monacelli]
  year: 2005
  title: "Monetary Policy and Exchange Rate Volatility in a Small Open Economy"
  journal: "Review of Economic Studies 72(3), 707-734"
  doi: 10.1111/j.1467-937X.2005.00349.x
  url: null

variables:
  provides: []
  requires: [e]

parameters: []

equations:
  - id: policy-peg
    status: original
    source_check: verified_primary
    derivation: "docs/theory/open-economy.md#monetary-regimes"
    expr: "e"
    description: The nominal exchange rate is held at its steady-state value
    source: "Gali and Monacelli (2005), p. 724-725"

depends_on: [core-soe-gm]
incompatible_with: [rule-domestic-inflation, rule-cpi-inflation, rule-optimal-domestic-price-stability]
compatible_cores: [core-soe-gm]
minimum_perturbation_order: 1
solution_requirement: null

assumptions:
  - id: exchange-rate-pins-the-price-level
    status: canonical
    embodied_in: [policy-peg]
    statement: >
      Fixing the nominal exchange rate pins the domestic price level through the law of
      one price, so this is the only regime in the family whose solution is stationary.
    substituting: >
      The three inflation-based regimes all leave a unit root.

verification:
