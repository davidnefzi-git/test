id: smets-wouters-2007
name: Shocks and frictions in US business cycles (Smets and Wouters 2007)
family: monetary-dsge
summary: >
  The canonical estimated medium-scale DSGE model: capital with costly utilisation and
  costly adjustment of investment, habit formation, Calvo prices and wages with partial
  indexation under Kimball aggregators, seven structural shocks, and an estimated
  interest-rate rule. Thirty-seven equations from twelve components.

  The twelfth component is not a friction. The policy rule responds to output less its
  FLEXIBLE-PRICE counterpart, and that counterpart is the output of a parallel economy.
  Rather than write that economy out a second time -- eleven more equations with every
  coefficient repeated, free to drift from the equations they duplicate -- the entry
  declares a flexible-price twin, composed from a subset of its own components, so that
  every equation the two economies share is stored exactly once. See
  docs/composition/README.md section 2.2d.

composition:
  core: core-nk-medium
  blocks:
    - capital-utilisation
    - fiscal-block-simple
    - habit-consumption
    - investment-adjustment-cost
    - calvo-prices-kimball
    - price-indexation
    - calvo-wages-kimball
    - wage-indexation
    - fisher-equation
    - taylor-rule-sw
  shadow:
    components:
      - core-nk-medium
      - capital-utilisation
      - fiscal-block-simple
      - habit-consumption
      - investment-adjustment-cost
    suffix: _f
    shared: [a, b, g, zi]
    drop:
      - core-nk-medium.technology
      - core-nk-medium.risk-premium
      - fiscal-block-simple.spending
      - investment-adjustment-cost.investment-shock

citation:
  authors: [Smets, Wouters]
  year: 2007
  title: "Shocks and Frictions in US Business Cycles: A Bayesian DSGE Approach"
  journal: "American Economic Review 97(3), 586-606"
  doi: 10.1257/aer.97.3.586

# Empirical evidence is a separate information resource, not a runnable estimator.
estimation_reference:
  publication: "American Economic Review 97(3), 586-606"
  specification: "estimation.yaml"
  interpretation: "spec/estimation.md"
  status: "published results documented; no estimation performed by the library"

economics:
  question: >
    How much of US business cycle fluctuation is accounted for by each of seven
    structural shocks, once a medium-scale model with nominal and real frictions is
    estimated on the data?
  time: dynamic-stochastic
  uncertainty: aggregate
  open_economy: false
  agents: [representative household, monopolistically competitive firms, monopolistically competitive labour suppliers, central bank, government]
  equilibrium: >
    Closed economy with a balanced growth path, log-linearised about the deterministic
    steady state. Growth bears on the coefficients and not only on the data: the
    effective discount factor throughout is beta*gamma^(1-sigma_c), not beta.
  frictions:
    - staggered price setting with partial indexation
    - staggered wage setting with partial indexation
    - external habit formation in consumption
    - costly adjustment of the rate of investment
    - costly variation in capital utilisation
    - fixed costs in production
  mechanisms: [nominal-rigidity, real-rigidity, capital-accumulation, monetary-transmission]
  policy_instruments: [nominal interest rate]
  calibration_region: "United States"

common_variable_map:
  # Eight of the family's nine; only a credit spread is missing, and it would need a
  # financial friction the library does not carry.
  #
  # output_gap is an EXPRESSION and not a variable name. In this model the gap is not a
  # variable at all: it is output less its counterpart in the flexible-price twin. The
  # alternative would have been to report no output gap for the family's most-used
  # model.
  output: y
  output_gap: "y - y_f"
  inflation: pi
  policy_rate: i
  consumption: c
  investment: inv
  hours: n
  real_wage: w

shocks:
  - id: eps_a
    description: Innovation to total factor productivity
    normalisation: one unit, positive raises productivity
  - id: eps_b
    description: Innovation to the risk-premium wedge
    normalisation: >
      one unit, positive widens the premium and so lowers consumption and the value of
      installed capital. This is the article's sign; a widely used replication uses the
      opposite one, folded into a rescaling of the wedge.
  - id: eps_g
    description: Innovation to exogenous spending
    normalisation: one unit of steady-state output, positive raises spending
  - id: eps_zi
    description: Innovation to the marginal efficiency of investment
    normalisation: one unit, positive raises the efficiency of investment
  - id: eps_v
    description: Innovation to the policy rate
    normalisation: one unit, positive is contractionary
  - id: eps_p
    description: Innovation to the price markup
    normalisation: one unit, positive raises the markup and so raises inflation
  - id: eps_w
    description: Innovation to the wage markup
    normalisation: one unit, positive raises the markup and so raises the wage

verification:
  tier: composed
  notes: >
    First-order dynamics of the Smets–Wouters model at the documented parameter
    values. The final American Economic Review article has now been checked for
    its empirical observation system, Bayesian priors, posterior results and
    estimation method, which are recorded in estimation.yaml and spec/estimation.md.
    The component solver still implements only first-order dynamics; it does not
    run the AER Bayesian estimation or produce its marginal likelihood.
  open_questions:
    - "The estimation is not reproduced: no Bayesian sampler, and the authors' data are not redistributable."
    - "The variance decomposition that is the article's headline result needs unconditional moments, which this harness does not compute."
    - "Welfare comparisons across the frictions need a second order, out of reach while equations are supplied log-linearised."
    - "The seven measurement relations are documented in estimation.yaml (AER eq. 15), but no estimator implements them."
    - "The component defaults reproduce posterior MEANS from AER Tables 1A–1B; posterior MODES, dispersion and quantiles are separately preserved in estimation.yaml."

provenance:
  license: "Own implementation, written from the article's numbered equations"
  permission_note: >
    The implementation is written from the published AER article and the ECB working-paper
    equation conventions. No external replication source file or estimation dataset is
    stored in this repository.
