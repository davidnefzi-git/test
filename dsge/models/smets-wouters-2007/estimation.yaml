# Smets and Wouters (2007): AER empirical reference, NOT fitted output of this library.
# This file transcribes published information. Its parameter values are not generated
# by the structural solution code; the article's data and sampler are not in this repo.
model: smets-wouters-2007
reference:
  authors: [Smets, Wouters]
  year: 2007
  publication: "American Economic Review 97(3), 586–606"
  doi: "10.1257/aer.97.3.586"
  pdf_printed_pages: [586, 606]
status: published-reference-only

observations:
  source_equation: "(15), AER p. 592"
  frequency: quarterly
  estimation_sample: {start: "1966Q1", end: "2004Q4", quarters: 156}
  data_appendix: "The paper refers to an external Data Appendix; it is not part of the supplied 21-page PDF."
  measurement_error: "None is specified in the published observation vector (15)."
  trend_growth:
    symbol: gamma_bar
    interpretation: "100*(gamma-1); common quarterly percentage growth trend"
    component_parameter: core-nk-medium.gamma_trend
  measurement_system:
    - {series: dlGDP, concept: real GDP growth, transformation: "100*log difference", model_relation: "gamma_bar + y_t - y_(t-1)"}
    - {series: dlCONS, concept: real consumption growth, transformation: "100*log difference", model_relation: "gamma_bar + c_t - c_(t-1)"}
    - {series: dlINV, concept: real investment growth, transformation: "100*log difference", model_relation: "gamma_bar + inv_t - inv_(t-1)"}
    - {series: dlWAG, concept: real wage growth, transformation: "100*log difference", model_relation: "gamma_bar + w_t - w_(t-1)"}
    - {series: lHOURS, concept: log hours worked, transformation: "100*log level; paper-specific normalization", model_relation: "hours_bar + n_t"}
    - {series: dlP, concept: inflation, transformation: "100*log difference of price level", model_relation: "pi_bar + pi_t"}
    - {series: FEDFUNDS, concept: nominal interest rate, transformation: "quarterly percentage-rate convention of eq. (15)", model_relation: "r_bar + i_t"}
  additional_estimated_measurement_parameters:
    - {name: hours_bar, paper_symbol: "l̄", interpretation: steady-state log hours intercept}
    - {name: pi_bar, paper_symbol: "π̄", interpretation: quarterly steady-state inflation in percentage points}
  steady_state_rate:
    paper_equation: "r_bar = 100*(beta^(-1)*gamma^sigma_c*Pi_bar - 1)"
    paper_definitions: "Pi_bar = 1 + pi_bar/100; beta = 1/(1 + beta_pct/100); gamma = 1 + gamma_trend/100"
    interpretation: "Nominal rate mean is derived; it is not an additional free estimated parameter."

estimation_procedure:
  source: "Section II, pp. 591–595; footnotes 6, 7 and 11"
  likelihood: "Linear rational-expectations state-space likelihood for the seven observable series."
  posterior: "p(theta | Y) proportional to p(Y | theta)*p(theta), with the priors in Tables 1A and 1B."
  stage_1: "Find posterior mode by maximizing the log posterior."
  stage_2: "Metropolis–Hastings sampling of the posterior."
  mh:
    draws: 250000
    burn_in: 50000
    proposal_scale: 0.30
    reported_rejection_rate: 0.65
    retained_draws_if_single_reported_chain: 200000
    diagnostics:
      - "Brooks–Gelman convergence comparison across multiple chains"
      - "Cumulative mean minus overall mean (Bauwens et al. 2000; Richéard 2000, as cited)"
    caveat: "The AER reports an MH sample of 250,000 with 50,000 discarded; it does not fully identify every software/initialization choice in the printed article."
  marginal_likelihood:
    methods: ["modified harmonic mean from posterior draws (Geweke 1998)", "Laplace approximation around the posterior mode"]
    source: "Section III and footnote 11, AER p. 595"
  forecast_comparison:
    source: "Section III, Table 2, pp. 595–596"
    alternatives: ["unrestricted VAR(1)–VAR(5)", "Sims–Zha BVAR", "DSGE"]
    common_training_sample: "1956Q1–1965Q4"
    warning: "The training sample is used in this comparative exercise, not the main DSGE estimation window."
    reported_log_marginal_likelihood:
      DSGE: -905.8
      VAR1_unrestricted: -928.0
      VAR2_unrestricted: -966.6
      VAR3_unrestricted: -1018.1
      VAR4_unrestricted: -1131.2
      BVAR4_Sims_Zha_prior: -906.6
  source_tables:
    structural_parameters: "Table 1A, AER p. 593 (PDF p. 8)"
    shocks: "Table 1B, AER p. 594 (PDF p. 9)"
    marginal_likelihood_comparison: "Table 2, AER p. 595 (PDF p. 10)"
    friction_sensitivity: "Table 4, AER p. 597 (PDF p. 12)"
    subsamples: "Table 5, AER p. 603 (PDF p. 18)"

fixed_calibrations:
  source: "Section II.A, AER p. 592"
  values:
    - {component_parameter: core-nk-medium.delta, value: 0.025, interpretation: quarterly depreciation rate}
    - {component_parameter: core-nk-medium.g_y, value: 0.18, interpretation: exogenous spending to GDP}
    - {component_parameter: core-nk-medium.markup_w, value: 1.5, interpretation: steady-state wage markup}
    - {component_parameter: calvo-prices-kimball.curv_p, value: 10.0, interpretation: Kimball goods-market curvature}
    - {component_parameter: calvo-wages-kimball.curv_w, value: 10.0, interpretation: Kimball labor-market curvature}

# Structural parameter priors are parameterized by mean and SD (Table 1A).
# Posterior endpoints are the 5th and 95th percentiles (not standard errors).
structural_table_1a:
  - {symbol: "varphi", name: varphi_i, component: investment-adjustment-cost, prior: [normal, 4.00, 1.50], mode: 5.48, mean: 5.74, p05: 3.97, p95: 7.42}
  - {symbol: sigma_c, name: sigma_c, component: core-nk-medium, prior: [normal, 1.50, 0.37], mode: 1.39, mean: 1.38, p05: 1.16, p95: 1.59}
  - {symbol: h, name: lambda_h, component: habit-consumption, prior: [beta, 0.70, 0.10], mode: 0.71, mean: 0.71, p05: 0.64, p95: 0.78}
  - {symbol: xi_w, name: xi_w, component: calvo-wages-kimball, prior: [beta, 0.50, 0.10], mode: 0.73, mean: 0.70, p05: 0.60, p95: 0.81}
  - {symbol: sigma_l, name: sigma_l, component: core-nk-medium, prior: [normal, 2.00, 0.75], mode: 1.92, mean: 1.83, p05: 0.91, p95: 2.78}
  - {symbol: xi_p, name: xi_p, component: calvo-prices-kimball, prior: [beta, 0.50, 0.10], mode: 0.65, mean: 0.66, p05: 0.56, p95: 0.74}
  - {symbol: iota_w, name: iota_w, component: wage-indexation, prior: [beta, 0.50, 0.15], mode: 0.59, mean: 0.58, p05: 0.38, p95: 0.78}
  - {symbol: iota_p, name: iota_p, component: price-indexation, prior: [beta, 0.50, 0.15], mode: 0.22, mean: 0.24, p05: 0.10, p95: 0.38}
  - {symbol: psi, name: psi_u, component: capital-utilisation, prior: [beta, 0.50, 0.15], mode: 0.54, mean: 0.54, p05: 0.36, p95: 0.72}
  - {symbol: Phi, name: phi_p, component: core-nk-medium, prior: [normal, 1.25, 0.12], mode: 1.61, mean: 1.60, p05: 1.48, p95: 1.73}
  - {symbol: r_pi, name: r_pi, component: taylor-rule-sw, prior: [normal, 1.50, 0.25], mode: 2.03, mean: 2.04, p05: 1.74, p95: 2.33}
  - {symbol: rho, name: rho_i, component: taylor-rule-sw, prior: [beta, 0.75, 0.10], mode: 0.81, mean: 0.81, p05: 0.77, p95: 0.85}
  - {symbol: r_y, name: r_y, component: taylor-rule-sw, prior: [normal, 0.12, 0.05], mode: 0.08, mean: 0.08, p05: 0.05, p95: 0.12}
  - {symbol: r_delta_y, name: r_dy, component: taylor-rule-sw, prior: [normal, 0.12, 0.05], mode: 0.22, mean: 0.22, p05: 0.18, p95: 0.27}
  - {symbol: pi_bar, name: pi_bar, component: null, prior: [gamma, 0.62, 0.10], mode: 0.81, mean: 0.78, p05: 0.61, p95: 0.96}
  - {symbol: "100*(beta^(-1)-1)", name: beta_pct, component: core-nk-medium, prior: [gamma, 0.25, 0.10], mode: 0.16, mean: 0.16, p05: 0.07, p95: 0.26}
  - {symbol: l_bar, name: hours_bar, component: null, prior: [normal, 0.00, 2.00], mode: -0.10, mean: 0.53, p05: -1.30, p95: 2.32}
  - {symbol: gamma_bar, name: gamma_trend, component: core-nk-medium, prior: [normal, 0.40, 0.10], mode: 0.43, mean: 0.43, p05: 0.40, p95: 0.45}
  - {symbol: alpha, name: alpha, component: core-nk-medium, prior: [normal, 0.30, 0.05], mode: 0.19, mean: 0.19, p05: 0.16, p95: 0.21}

# The AER describes an inverse-gamma prior on shock SDs (mean .10, df 2),
# and a beta prior on each AR/MA coefficient (mean .50, SD .20).
shock_table_1b:
  - {symbol: sigma_a, shock: eps_a, statistic: sd, component: core-nk-medium, prior: [invgamma, 0.10, 2.00], mode: 0.45, mean: 0.45, p05: 0.41, p95: 0.50}
  - {symbol: sigma_b, shock: eps_b, statistic: sd, component: core-nk-medium, prior: [invgamma, 0.10, 2.00], mode: 0.24, mean: 0.23, p05: 0.19, p95: 0.27}
  - {symbol: sigma_g, shock: eps_g, statistic: sd, component: fiscal-block-simple, prior: [invgamma, 0.10, 2.00], mode: 0.52, mean: 0.53, p05: 0.48, p95: 0.58}
  - {symbol: sigma_I, shock: eps_zi, statistic: sd, component: investment-adjustment-cost, prior: [invgamma, 0.10, 2.00], mode: 0.45, mean: 0.45, p05: 0.37, p95: 0.53}
  - {symbol: sigma_r, shock: eps_v, statistic: sd, component: taylor-rule-sw, prior: [invgamma, 0.10, 2.00], mode: 0.24, mean: 0.24, p05: 0.22, p95: 0.27}
  - {symbol: sigma_p, shock: eps_p, statistic: sd, component: calvo-prices-kimball, prior: [invgamma, 0.10, 2.00], mode: 0.14, mean: 0.14, p05: 0.11, p95: 0.16}
  - {symbol: sigma_w, shock: eps_w, statistic: sd, component: calvo-wages-kimball, prior: [invgamma, 0.10, 2.00], mode: 0.24, mean: 0.24, p05: 0.20, p95: 0.28}
  - {symbol: rho_a, name: rho_a, component: core-nk-medium, prior: [beta, 0.50, 0.20], mode: 0.95, mean: 0.95, p05: 0.94, p95: 0.97}
  - {symbol: rho_b, name: rho_b, component: core-nk-medium, prior: [beta, 0.50, 0.20], mode: 0.18, mean: 0.22, p05: 0.07, p95: 0.36}
  - {symbol: rho_g, name: rho_g, component: fiscal-block-simple, prior: [beta, 0.50, 0.20], mode: 0.97, mean: 0.97, p05: 0.96, p95: 0.99}
  - {symbol: rho_I, name: rho_zi, component: investment-adjustment-cost, prior: [beta, 0.50, 0.20], mode: 0.71, mean: 0.71, p05: 0.61, p95: 0.80}
  - {symbol: rho_r, name: rho_v, component: taylor-rule-sw, prior: [beta, 0.50, 0.20], mode: 0.12, mean: 0.15, p05: 0.04, p95: 0.24}
  - {symbol: rho_p, name: rho_p, component: calvo-prices-kimball, prior: [beta, 0.50, 0.20], mode: 0.90, mean: 0.89, p05: 0.80, p95: 0.96}
  - {symbol: rho_w, name: rho_w, component: calvo-wages-kimball, prior: [beta, 0.50, 0.20], mode: 0.97, mean: 0.96, p05: 0.94, p95: 0.99}
  - {symbol: mu_p, name: mu_p, component: calvo-prices-kimball, prior: [beta, 0.50, 0.20], mode: 0.74, mean: 0.69, p05: 0.54, p95: 0.85}
  - {symbol: mu_w, name: mu_w, component: calvo-wages-kimball, prior: [beta, 0.50, 0.20], mode: 0.88, mean: 0.84, p05: 0.75, p95: 0.93}
  - {symbol: rho_ga, name: rho_ga, component: fiscal-block-simple, prior: [beta, 0.50, 0.20], mode: 0.52, mean: 0.52, p05: 0.37, p95: 0.66}

reported_robustness:
  friction_sensitivity:
    source: "Table 4, AER p. 597"
    reference_log_marginal_likelihood: -923
    comparisons:
      - {restriction: "xi_p = 0.1", value: -975}
      - {restriction: "xi_w = 0.1", value: -973}
      - {restriction: "iota_p = 0.0", value: -918}
      - {restriction: "iota_w = 0.0", value: -927}
      - {restriction: "varphi_i = 0.1", value: -1084}
      - {restriction: "lambda_h = 0.1", value: -959}
      - {restriction: "psi_u = 0.99", value: -924}
      - {restriction: "phi_p = 1.1", value: -949}
    warning: "The Table 4 baseline (-923) differs from Table 2's DSGE log marginal likelihood (-905.8). The printed paper does not give enough information here to equate these two numbers mechanically."
  subsamples:
    source: "Table 5, AER p. 603"
    windows: ["1966Q1–1979Q2", "1984Q1–2004Q4"]
    result_type: "posterior modes and SDs; not the posterior means from Table 1"
  other_outputs:
    - "Table 3: out-of-sample forecast comparisons (VAR, BVAR, DSGE)"
    - "Figures 1, 4: forecast-error variance decompositions and historical decompositions"
    - "Figures 2, 3, 6, 7: responses to shocks with posterior uncertainty"
    - "Figure 5: data-versus-model correlation exercise"
    - "Table 6: volatility and counterfactual decompositions"
