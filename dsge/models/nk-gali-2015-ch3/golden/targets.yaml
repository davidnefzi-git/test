# Golden targets for nk-gali-2015-ch3.
#
# Every target is a closed form in the model's own parameters, so it holds at any
# calibration instead of only at the one the book happens to print. Sources are given
# as the standard textbook results.
targets:

- id: nk-monetary-impact-output-gap
  kind: analytic
  description: Impact response of the output gap to a one-unit monetary policy shock
  source: "Gali (2015) ch. 3, closed-form solution for the monetary policy shock"
  composition: [core-nk-classical, calvo-prices, taylor-rule]
  shock: eps_v
  variable: x
  period: 0
  expected: "-(1 - beta*rho_v)*Lambda_v"
  where:
    Lambda_v: "1/((1 - beta*rho_v)*(sigma*(1 - rho_v) + phi_x) + kappa*(phi_pi - rho_v))"
  rtol: 1.0e-10

- id: nk-monetary-impact-inflation
  kind: analytic
  description: Impact response of inflation to a one-unit monetary policy shock
  source: "Gali (2015) ch. 3, closed-form solution for the monetary policy shock"
  composition: [core-nk-classical, calvo-prices, taylor-rule]
  shock: eps_v
  variable: pi
  period: 0
  expected: "-kappa*Lambda_v"
  where:
    Lambda_v: "1/((1 - beta*rho_v)*(sigma*(1 - rho_v) + phi_x) + kappa*(phi_pi - rho_v))"
  rtol: 1.0e-10

- id: nk-monetary-impact-output-gap-alt-calibration
  kind: analytic
  description: The same target at a different calibration, to check that the closed form is matched and not a coincidence of the default values
  source: "Gali (2015) ch. 3, same closed form"
  composition: [core-nk-classical, calvo-prices, taylor-rule]
  params: {theta_p: 0.6, phi_pi: 2.0, rho_v: 0.8, sigma: 2.0}
  shock: eps_v
  variable: x
  period: 0
  expected: "-(1 - beta*rho_v)*Lambda_v"
  where:
    Lambda_v: "1/((1 - beta*rho_v)*(sigma*(1 - rho_v) + phi_x) + kappa*(phi_pi - rho_v))"
  rtol: 1.0e-10

- id: classical-monetary-impact-inflation
  kind: analytic
  description: >
    In the classical composition the output gap is zero and inflation is pinned by the
    policy rule alone, giving -1/(phi_pi - rho_v). This target verifies the composition
    that the nesting test must recover.
  source: "Gali (2015) ch. 3, classical monetary model"
  composition: [core-nk-classical, taylor-rule]
  shock: eps_v
  variable: pi
  period: 0
  expected: "-1/(phi_pi - rho_v)"
  rtol: 1.0e-12

- id: classical-monetary-neutrality
  kind: analytic
  description: "Monetary neutrality: the output gap does not respond to a monetary shock under flexible prices"
  source: "Gali (2015) ch. 3, classical monetary model"
  composition: [core-nk-classical, taylor-rule]
  shock: eps_v
  variable: x
  period: 0
  expected: "0*phi_pi"
  rtol: 1.0e-12

- id: calvo-prices-nesting
  kind: nesting
  description: >
    As the Calvo non-reset probability goes to zero the block must vanish: the output
    gap response returns to the classical value of zero, at a rate linear in theta_p
    with the analytically implied constant.
  source: "Nesting target declared in components/calvo-prices/component.yaml"
  composition: [core-nk-classical, calvo-prices, taylor-rule]
  recovers: [core-nk-classical, taylor-rule]
  parameter: theta_p
  sequence: [0.1, 0.01, 1.0e-3, 1.0e-4]
  shock: eps_v
  variable: x
  period: 0
  tolerance: 1.0e-4
  rate: "-(1 - beta*rho_v)/(Theta*(sigma + (varphi + alpha)/(1 - alpha))*(phi_pi - rho_v))"
  rate_rtol: 1.0e-3
