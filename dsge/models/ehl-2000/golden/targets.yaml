# Golden targets for ehl-2000, the two-friction model.
#
# No closed form exists at a general calibration, so the entry is verified at its two
# limits, where one does. The two limits check the price block and the wage block
# SEPARATELY: a single target at an interior calibration could be satisfied by two
# compensating errors.
targets:

- id: flexible-wage-limit-output-gap
  kind: analytic
  description: >
    With the wage rigidity driven to zero the model must reproduce nk-gali-2015-ch3,
    whose own targets are verified closed forms: the library checking itself against
    itself. At theta_w = 1e-8 the residual is 9.2e-8, linear in theta_w, hence rtol 1e-6.
  source: "Gali (2015) ch. 3 closed form, recovered as the flexible-wage limit of ch. 6"
  composition: [core-nk-classical, calvo-prices, calvo-wages, taylor-rule]
  params: {theta_w: 1.0e-8}
  shock: eps_v
  variable: x
  period: 0
  expected: "-(1 - beta*rho_v)*Lambda_v"
  where:
    Lambda_v: "1/((1 - beta*rho_v)*(sigma*(1 - rho_v) + phi_y) + kappa*(phi_pi - rho_v))"
  rtol: 1.0e-6

- id: flexible-wage-limit-inflation
  kind: analytic
  description: Same limit, inflation response
  source: "Gali (2015) ch. 3 closed form, recovered as the flexible-wage limit of ch. 6"
  composition: [core-nk-classical, calvo-prices, calvo-wages, taylor-rule]
  params: {theta_w: 1.0e-8}
  shock: eps_v
  variable: pi
  period: 0
  expected: "-kappa*Lambda_v"
  where:
    Lambda_v: "1/((1 - beta*rho_v)*(sigma*(1 - rho_v) + phi_y) + kappa*(phi_pi - rho_v))"
  rtol: 1.0e-6

- id: flexible-price-limit-output-gap
  kind: analytic
  description: >
    The mirror limit, which checks the WAGE block on its own. With alpha = 0 and the
    price rigidity driven to zero, flexible prices hold marginal cost at zero, the real
    wage gap vanishes, wage inflation equals price inflation, and the model reduces to
    the same three-equation form with kappa replaced by lambda_w*(sigma + varphi).
  source: "Gali (2015) ch. 6, wage inflation dynamics under flexible prices"
  composition: [core-nk-classical, calvo-prices, calvo-wages, taylor-rule]
  params: {alpha: 0.0, theta_p: 1.0e-8}
  shock: eps_v
  variable: x
  period: 0
  expected: "-(1 - beta*rho_v)*Lambda_w"
  where:
    kappa_w: "lambda_w*(sigma + varphi)"
    Lambda_w: "1/((1 - beta*rho_v)*(sigma*(1 - rho_v) + phi_y) + kappa_w*(phi_pi - rho_v))"
  rtol: 1.0e-8

- id: flexible-price-limit-inflation
  kind: analytic
  description: Same mirror limit, inflation response
  source: "Gali (2015) ch. 6, wage inflation dynamics under flexible prices"
  composition: [core-nk-classical, calvo-prices, calvo-wages, taylor-rule]
  params: {alpha: 0.0, theta_p: 1.0e-8}
  shock: eps_v
  variable: pi
  period: 0
  expected: "-kappa_w*Lambda_w"
  where:
    kappa_w: "lambda_w*(sigma + varphi)"
    Lambda_w: "1/((1 - beta*rho_v)*(sigma*(1 - rho_v) + phi_y) + kappa_w*(phi_pi - rho_v))"
  rtol: 1.0e-8

- id: calvo-wages-nesting
  kind: nesting
  description: The wage block must vanish as theta_w goes to zero, returning the model to nk-gali-2015-ch3
  source: "Nesting target declared in components/calvo-wages/component.yaml"
  composition: [core-nk-classical, calvo-prices, calvo-wages, taylor-rule]
  recovers: [core-nk-classical, calvo-prices, taylor-rule]
  parameter: theta_w
  sequence: [0.1, 0.01, 1.0e-4, 1.0e-6]
  shock: eps_v
  variable: x
  period: 0
  tolerance: 1.0e-4
